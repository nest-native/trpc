name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-build:
    name: Package build/typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --workspace @nest-native/trpc

      - name: Typecheck package
        run: npm run typecheck --workspace @nest-native/trpc

  package-coverage:
    name: Package coverage (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Restore base branch CI data
        if: github.event_name == 'pull_request' && matrix.node-version == '22'
        id: base-ci-data
        uses: actions/cache/restore@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.base_ref }}-
          restore-keys: ci-data-node-22-${{ github.base_ref }}-

      - name: Extract base CI data
        if: steps.base-ci-data.outputs.cache-matched-key
        run: |
          cp ci-data/coverage-summary.json base-coverage-summary.json 2>/dev/null || true
          cp ci-data/test-results.json base-test-results.json 2>/dev/null || true
          cp ci-data/test-step-duration-ms.txt base-test-step-duration-ms.txt 2>/dev/null || true
          cp ci-data/cognitive-complexity-summary.json base-cognitive-complexity-summary.json 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          START=$SECONDS
          TS_NODE_PROJECT=tsconfig.spec.json npx nyc mocha 'packages/**/*.spec.ts' --reporter mocha-multi-reporters --reporter-option configFile=.github/scripts/mocha-reporters-config.json
          echo $(( (SECONDS - START) * 1000 )) > test-step-duration-ms.txt

      - name: Run cognitive complexity report
        if: matrix.node-version == '22'
        run: npm run complexity:report

      - name: Cache CI data for base branch
        if: github.event_name == 'push' && matrix.node-version == '22'
        run: |
          mkdir -p ci-data
          cp coverage/coverage-summary.json ci-data/coverage-summary.json
          cp test-results.json ci-data/test-results.json
          cp test-step-duration-ms.txt ci-data/test-step-duration-ms.txt
          cp complexity/cognitive-complexity-summary.json ci-data/cognitive-complexity-summary.json

      - if: github.event_name == 'push' && matrix.node-version == '22'
        uses: actions/cache/save@v6
        with:
          path: ci-data
          key: ci-data-node-22-${{ github.ref_name }}-${{ github.sha }}

      - name: Get changed files
        if: github.event_name == 'pull_request' && matrix.node-version == '22'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/**/*.ts' | tee changed-files.txt

      - name: Coverage Report
        if: github.event_name == 'pull_request' && matrix.node-version == '22'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/coverage-report.js');
            await report({ github, context, core });

      - name: Performance Report
        if: github.event_name == 'pull_request' && matrix.node-version == '22'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/performance-report.js');
            await report({ github, context, core });

      - name: Complexity Report
        if: github.event_name == 'pull_request' && matrix.node-version == '22'
        uses: actions/github-script@v9
        with:
          script: |
            const report = require('./.github/scripts/complexity-report.js');
            await report({ github, context, core });

      - name: Capture coverage summary
        if: matrix.node-version == '22'
        run: |
          node -e "
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const metrics = {
            statements: summary.statements.pct,
            branches: summary.branches.pct,
            functions: summary.functions.pct,
            lines: summary.lines.pct,
          };
          const badge = pct => pct >= 100 ? '🟢' : pct >= 99.99 ? '🟡' : '🔴';
          const avg = Math.round((metrics.statements + metrics.branches + metrics.functions + metrics.lines) / 4 * 100) / 100;
          const report = [
            '### 📊 Coverage Report',
            '',
            '| Metric | Coverage | Status |',
            '| :--- | ---: | :---: |',
            '| Statements | ' + metrics.statements + '% | ' + badge(metrics.statements) + ' |',
            '| Branches | ' + metrics.branches + '% | ' + badge(metrics.branches) + ' |',
            '| Functions | ' + metrics.functions + '% | ' + badge(metrics.functions) + ' |',
            '| Lines | ' + metrics.lines + '% | ' + badge(metrics.lines) + ' |',
            '',
            '**Overall: ' + avg + '%** ' + badge(avg),
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report + '\n');
          "

      - name: Upload coverage artifacts
        if: matrix.node-version == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/lcov-report/**
            test-results.json
          if-no-files-found: error

  cognitive-complexity:
    name: Cognitive complexity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Enforce cognitive complexity threshold
        run: npm run complexity:check

  docs-snippets:
    name: Docs snippet typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck docs snippets (unit)
        run: npm run docs:test:typecheck:unit

      - name: Typecheck docs snippets (sample-mapped)
        run: npm run docs:test:typecheck:sample

  docs-site:
    name: Docusaurus build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install docs website dependencies
        run: npm --prefix website ci

      - name: Build docs site
        run: npm --prefix website run build

  showcase:
    name: Showcase checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run showcase checks
        run: npm run ci:showcase

  focused-samples:
    name: Focused sample checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run focused sample checks
        run: npm run sample:focused

  nestjs-compat:
    name: NestJS ${{ matrix.nest.label }} compatibility (Node 22)
    runs-on: ubuntu-latest
    # The published peer range is @nestjs/common and @nestjs/core ^11 || ^12.
    # The devDependencies and the lockfile every other job installs stay on
    # the 11.x in the middle of that range, so this matrix is what makes its
    # two ENDS tested claims: each leg installs one end on top of the lockfile
    # with --no-save and runs the suite and every sample against it.
    #
    # Two things keep a leg honest, because npm makes it easy to run a suite
    # against a tree that is not the one you asked for:
    # - --workspaces --include-workspace-root: the samples pin @nestjs/* to an
    #   exact 11.x, and a root-only install leaves them a nested 11 while the
    #   root moves.
    # - scripts/check-nestjs-resolution.mjs proves the version from inside
    #   every workspace (exactly, at the floor), fails on nested copies, and
    #   checks every peer range in the NestJS ecosystem against the tree the
    #   suite will run on. That final-tree check is the gate; the install log
    #   is printed for diagnosis only. npm prints `ERESOLVE overriding peer
    #   dependency` and exits 0 both for a real override — the previous 12
    #   leg carried one: sample 09's @nestjs/config@^4 peers ^10 || ^11, npm
    #   overrode it, and the run was green — and for transitional states that
    #   end coherent (replacing @nestjs/* under a package whose peers admit
    #   both majors prints dozens in the sibling repos), so grepping for it
    #   was tried and dropped.
    # Node is not a dimension here on purpose: 22 floats to a current 22.x,
    # which is what require(esm) on the 12 end needs (>=22.12), and the build
    # job already covers 24.
    strategy:
      fail-fast: false
      matrix:
        nest:
          # 11.0.0 is the oldest graph the published range can produce for the
          # framework set: nothing this package uses was added by a later 11.x
          # (every @nestjs/core internal it deep-imports exists with the same
          # signature at 11.0.0). Pinned exactly so a downgrade that silently
          # no-ops cannot pass as a floor run.
          # fastify: @nestjs/platform-fastify 11.0.0 and 11.0.1 were published
          # peering @nestjs/common and @nestjs/core ^10; 11.0.2 is the first
          # release that admits 11, so it is the oldest fastify that installs
          # next to common 11.0.0 at all. That is an install-graph fact about
          # a sibling package, not a floor of ours, so the published range does
          # not change for it.
          # config: sample 09's own range, which peers ^10 || ^11.
          - { label: '11 floor', spec: '11.0.0', fastify: '11.0.2', config: '^4.0.4' }
          # ^12.0.0 floats, so a new 12.x patch is tested on the next run.
          # config: @nestjs/config has its own version line; 12.0.0 is the
          # first that peers ^11 || ^12.
          - { label: '12', spec: '^12.0.0', fastify: '^12.0.0', config: '^12.0.0' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install NestJS ${{ matrix.nest.label }} (this job only, never saved)
        run: |
          npm install --no-save --workspaces --include-workspace-root \
            "@nestjs/common@${{ matrix.nest.spec }}" \
            "@nestjs/core@${{ matrix.nest.spec }}" \
            "@nestjs/testing@${{ matrix.nest.spec }}" \
            "@nestjs/platform-express@${{ matrix.nest.spec }}" \
            "@nestjs/microservices@${{ matrix.nest.spec }}" \
            "@nestjs/platform-fastify@${{ matrix.nest.fastify }}" \
            "@nestjs/config@${{ matrix.nest.config }}"

      - name: Prove every workspace resolves NestJS ${{ matrix.nest.label }}
        run: |
          node scripts/check-nestjs-resolution.mjs "${{ matrix.nest.spec }}" \
            "@nestjs/platform-fastify@${{ matrix.nest.fastify }}" \
            "@nestjs/config@${{ matrix.nest.config }}"

      - name: Run the suite against NestJS ${{ matrix.nest.label }}
        run: npm test

      - name: Run the samples against NestJS ${{ matrix.nest.label }}
        run: npm run ci:sample

  release-and-security:
    name: Release and security checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:check

      - name: Audit production supply chain
        run: npm run security:audit
