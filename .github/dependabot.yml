version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      dev-tooling-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      # The peer/runtime set (listed below) is grouped across majors too, not
      # just minors and patches. The @nestjs/* packages peer on each other, so
      # a major that arrives one-package-per-PR produces a tree npm refuses to
      # install: NestJS 12 opened fifteen separate PRs across this org, each
      # bumping one package and leaving its siblings on 11, and every one failed
      # `npm ci` with ERESOLVE before a single test ran. Grouped, a major
      # arrives as one PR that can actually be evaluated, together with the
      # runtime peers it ships against. Every @nestjs/* package the repo
      # declares that peers on common/core belongs here - one left out
      # reproduces the split-major failure.
      nest-trpc-peer:
        update-types:
          - "major"
          - "minor"
          - "patch"
        patterns:
          - "@nestjs/common"
          - "@nestjs/config"
          - "@nestjs/core"
          - "@nestjs/microservices"
          - "@nestjs/platform-express"
          - "@nestjs/platform-fastify"
          - "@trpc/*"
          - "reflect-metadata"
          - "rxjs"
          - "zod"
          - "@nestjs/testing"
      # Same shape for Angular in sample 12: @angular/common, core, compiler,
      # platform-browser and compiler-cli pin each other to the EXACT version,
      # so one-package-per-PR patch bumps produced a 22.1.0/22.1.3/22.1.7 mix
      # that npm only installed by overriding peers (a warning, exit 0). One
      # group, majors included, so the set moves together.
      angular:
        update-types:
          - "major"
          - "minor"
          - "patch"
        patterns:
          - "@angular/*"

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      docusaurus-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "@docusaurus/*"
      website-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "@docusaurus/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
